<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wanderlust</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none; 
      user-select: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }
    
    #touch-controls {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
    }
    
    #joystick-base {
      position: absolute; left: 40px; bottom: 40px;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
    }
    
    #joystick-knob {
      position: absolute; left: 50%; top: 50%;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #boost-btn {
      position: fixed; right: 20px; bottom: 25px;
      width: 75px; height: 75px; border-radius: 50%;
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      user-select: none; pointer-events: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      background: rgba(59, 130, 246, 0.75); border: 2px solid rgba(96, 165, 250, 0.9);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    @media (max-width: 768px) {
      #world-map { display: none !important; }
    }

    #ui-stack {
      position: fixed; right: 16px; top: 16px;
      z-index: 10; pointer-events: auto;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    #ui-stack button {
      color: rgba(60, 50, 70, 0.9); background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px); padding: 8px 14px;
      border-radius: 8px; font-size: 13px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.4); font-weight: bold; width: fit-content;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #ui-stack button:hover {
      background: rgba(255, 255, 255, 0.85);
    }


    @media (hover: hover) and (pointer: fine) {
      #touch-controls { display: none; }
    }
    .dg { zoom: 1.2 !important; }
    .dg.ac { zoom: 1.2 !important; }
  </style>

  <style>
    /* modern top bar */
    #top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      z-index: 100;
      pointer-events: none;
      background: transparent;
      padding: 0;
      border: none;
    }
    #top-bar > * { pointer-events: auto; }
    #fps-counter {
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }
    #top-bar button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      font-size: 19px;
      padding: 4px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #top-bar button:active { transform: scale(0.88); opacity: 0.7; }
  </style>
</head>
<body>
<div id="debug-overlay" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: #b91c1c; color: #ffffff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; display: none;"></div>
<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    if (!overlay) return;
    overlay.style.display = 'block';
    overlay.innerHTML = '<div style="font-family: sans-serif; font-size: 14px; line-height: 1.5;">' +
        '<div style="font-weight: bold; margin-bottom: 6px;">Runtime Notification</div>' +
        '<div style="margin-bottom: 12px; word-break: break-word;">' + msg + '</div>' +
        '<div style="display: flex; gap: 8px;">' +
            '<a href="?webgl=1" style="display: inline-block; padding: 6px 12px; background: #ffffff; color: #000000; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 12px;">WebGL Fallback Mode</a>' +
            '<button onclick="window.location.reload()" style="padding: 6px 12px; background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid #ffffff; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer;">Reload</button>' +
            '<button onclick="this.closest(\'#debug-overlay\').style.display=\'none\'" style="padding: 6px 12px; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; font-size: 12px; cursor: pointer;">Dismiss</button>' +
        '</div>' +
    '</div>';
}
window.onerror = function(msg, url, line, col, error) {
    if (msg && (msg.includes('ResizeObserver') || msg.includes('Script error'))) return;
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    var reason = event.reason ? (event.reason.message || event.reason) : "unknown";
    if (reason && reason.includes('Device Lost')) return; // Handled specifically by renderer.onDeviceLost
    showError('Unhandled Rejection: ' + reason);
});
</script>
