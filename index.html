<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wanderlust</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #62b1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; touch-action: none; }
    
    /* Top Bar Header */
    #top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      z-index: 100;
      pointer-events: none;
      background: transparent;
      padding: 0;
      border: none;
    }

    #top-bar > * {
      pointer-events: auto;
    }

    #fps-counter {
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }

    #top-bar button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      font-size: 19px;
      padding: 4px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), 0 0 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    #top-bar button:active {
      transform: scale(0.88);
      opacity: 0.7;
    }

    #gui-toggle-btn {
      font-size: 20px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s ease;
    }

    /* Touch Controls */
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    
    #joystick-base {
      position: absolute;
      left: 36px;
      bottom: 36px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: auto;
      touch-action: none;
    }
    
    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transform: translate(-50%, -50%);
      pointer-events: none;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    #boost-btn {
      position: fixed;
      right: 36px;
      bottom: 72px;
      color: rgba(255, 255, 255, 0.88);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto;
      cursor: pointer;
      padding: 12px 16px;
      border: none;
      background: transparent;
      transition: transform 0.15s ease, opacity 0.15s ease, text-shadow 0.15s ease;
      z-index: 20;
    }

    #boost-btn:active {
      transform: scale(0.92);
      opacity: 0.75;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.9), 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    #sparkle-btn {
      position: fixed;
      right: 24px;
      bottom: 20px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s ease, opacity 0.15s ease;
      z-index: 20;
      outline: none;
      padding: 6px;
    }

    #sparkle-btn:active {
      transform: scale(1.3) rotate(45deg);
      color: #ffffff;
      opacity: 1;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    /* lil-gui styling on mobile & desktop */
    .lil-gui.root {
      position: fixed !important;
      right: 14px !important;
      top: 54px !important;
      max-width: min(340px, 92vw) !important;
      max-height: calc(100vh - 72px) !important;
      overflow-y: auto !important;
      border-radius: 12px !important;
      background: rgba(18, 22, 32, 0.9) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6) !important;
      z-index: 1000 !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    @media (max-width: 768px) {
      #world-map { display: none !important; }
    }
  </style>
</head>
<body>
<div id="debug-overlay" style="position: absolute; z-index: 9999; background: red; color: white; font-size: 24px; padding: 20px; display: none;"></div>
<script>
function showError(msg) {
    var overlay = document.getElementById('debug-overlay');
    overlay.style.display = 'block';
    overlay.innerHTML += msg + '<br><br>';
}
window.onerror = function(msg, url, line, col, error) {
    showError('Error: ' + msg + ' at line ' + line);
};
window.addEventListener("unhandledrejection", function(event) {
    showError('Unhandled Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : "unknown"));
});
const origConsoleError = console.error;
console.error = function(...args) {
    showError('Console Error: ' + args.join(' '));
    origConsoleError.apply(console, args);
};
</script>
  <div id="app"></div>

  <!-- Top Bar -->
  <div id="top-bar">
    <div id="fps-counter">FPS61</div>
    <button id="pause-toggle" title="Pause / Resume Flight">⏸</button>
    <button id="time-toggle" title="Cycle Time of Day">☼</button>
    <button id="fullscreen-toggle" title="Toggle Fullscreen">⛶</button>
    <button id="gui-toggle-btn" title="Settings & Editor Panel">⚙</button>
  </div>

  <!-- World Map Overlay -->
  <div id="world-map" style="display: none; position: fixed; bottom: 20px; left: 20px; z-index: 15; background: rgba(0,0,0,0.88); backdrop-filter: blur(12px); border-radius: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.3); width: 230px; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: all 0.25s ease-in-out;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div id="map-title-text" style="color: #ffe066; font-family: monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px;">🗺️ RADAR MAP</div>
      <div style="display: flex; gap: 4px; align-items: center;">
        <button id="zoom-out-btn" title="Zoom Out" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; padding: 1px 6px; border-radius: 4px; line-height: 1.2;">-</button>
        <button id="zoom-in-btn" title="Zoom In" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; padding: 1px 6px; border-radius: 4px; line-height: 1.2;">+</button>
        <button id="expand-map-btn" title="Expand / Collapse Map (M)" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #66ccff; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; padding: 1px 6px; border-radius: 4px; line-height: 1.2;">⤢</button>
        <button id="close-map-btn" title="Hide Map" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #ff6666; font-family: monospace; font-size: 12px; font-weight: bold; cursor: pointer; padding: 1px 6px; border-radius: 4px; line-height: 1.2;">✖</button>
      </div>
    </div>
    <canvas id="map-canvas" width="200" height="200" style="display: block; border-radius: 8px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.35); max-width: 100%;"></canvas>
    <div id="map-info-text" style="color: #ffffff; font-family: monospace; font-size: 10px; margin-top: 6px; opacity: 0.95; text-align: center; font-weight: bold;">Z: 0m</div>
  </div>

  <div id="hidden-ui" style="display: none;">
      <button id="god-mode-btn">God Mode</button>
      <button id="ocean-toggle-btn">Ocean</button>
      <div id="time-label"></div>
      <div id="biome-label"></div>
      <button id="editor-toggle">Terrain Editor</button>
      <button id="crystal-edit-toggle">Edit Crystals</button>
      <button id="char-toggle">Switch to Whale</button>
      <button id="invis-toggle">Model: VISIBLE</button>
      <button id="summer-toggle">Summer Filter: ON</button>
      <button id="music-toggle">Music</button>
      <button id="track-toggle">Track: Valley Wind</button>
      <button id="wind-toggle">Wind: ON</button>
  </div>

  <!-- Crystal Editor UI -->
  <div id="crystal-editor" style="display: none; position: fixed; left: 20px; top: 20px; width: 240px; box-sizing: border-box; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); color: white; padding: 15px; border-radius: 10px; font-family: sans-serif; z-index: 100; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.2);">
    <h3 style="margin-top:0; margin-bottom:10px; font-size:16px;">💎 Crystal & Env Editor</h3>
    <div style="margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #444;">
      <strong style="font-size:13px; display:block; margin-bottom:5px; color:#aaa;">Flying Crystals</strong>
      <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 5px;">
        <input type="color" id="c-f-col0" value="#6a00ff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col1" value="#ff0066" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col2" value="#ff6600" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col3" value="#ffcc00" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col4" value="#00ffaa" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-f-col5" value="#00aaff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
      </div>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Opacity <input type="range" id="c-fly-opacity" min="0" max="1" step="0.05" value="1.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Contrast <input type="range" id="c-fly-contrast" min="0.1" max="3" step="0.1" value="1.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Hue Shift <input type="range" id="c-fly-hue" min="0" max="1" step="0.01" value="0.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Base Glow <input type="range" id="c-baseGlow" min="0" max="3" step="0.1" value="1.2" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Night Glow <input type="range" id="c-nightGlow" min="0" max="5" step="0.1" value="1.5" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Roughness <input type="range" id="c-roughness" min="0" max="1" step="0.05" value="0.08" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Metalness <input type="range" id="c-metalness" min="0" max="1" step="0.05" value="0.15" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Transmission <input type="range" id="c-transmission" min="0" max="1" step="0.05" value="0.0" style="width:100%; box-sizing:border-box; display:block;"></label>
      <label style="font-size:12px; display:block; margin-bottom:4px;">Thickness <input type="range" id="c-thickness" min="0" max="20" step="0.5" value="10.0" style="width:100%; box-sizing:border-box; display:block;"></label>
    </div>
    <div style="margin-bottom: 5px;">
      <strong style="font-size:13px; display:block; margin-bottom:5px; color:#aaa;">Ground Crystals (Colors)</strong>
      <div style="display:flex; flex-wrap:wrap; gap:5px;">
        <input type="color" id="c-col0" value="#aa00ff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col1" value="#00ccff" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col2" value="#ff0088" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col3" value="#00ff88" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col4" value="#ffaa00" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
        <input type="color" id="c-col5" value="#ff00cc" style="width:25px;height:25px;padding:0;border:none;cursor:pointer;">
      </div>
    </div>
    <button id="c-close" style="margin-top: 15px; width: 100%; padding: 6px; cursor:pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-weight: bold; box-sizing: border-box;">Close Editor</button>
  </div>

  <div id="touch-controls">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="boost-btn">BOOST</div>
    <button id="sparkle-btn" title="Switch Character / Effect">✦</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
