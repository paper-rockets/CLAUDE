<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Model Viewer - Transparent</title>
  
  <style>
    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      
      /* Visual checkerboard to prove transparency */
      background-color: #f0f0f0;
      background-image: 
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0),
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      outline: none;
    }

    /* Terminal-style geometric UI container */
    .ui-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 10px 16px;
      font-family: monospace;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-block;
      user-select: none;
    }

    .btn:hover {
      background: #000000;
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    #labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    .label {
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: 1px solid #000;
      padding: 6px 12px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="labels-container"></div>
  
  <div class="ui-container">
    <label class="btn" for="file-upload">
      [ Load GLB(s) ]
    </label>
    <input type="file" id="file-upload" accept=".glb,.gltf" multiple>
    
    <button class="btn" id="export-btn">
      [ Export PNG ]
    </button>
    
    <button class="btn" id="fs-btn">
      [ Fullscreen ]
    </button>

    <button class="btn" id="clear-btn">
      [ Clear ]
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // Scene setup
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    // preserveDrawingBuffer is true to allow PNG export
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 0.1;
    controls.maxDistance = 500;

    // Lighting (Environment)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Loaders setup
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
    
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // State variables
    let models = [];
    let labels = [];
    let modelIndex = 0;
    const spacing = 5; // Spacing between models

    const fileUpload = document.getElementById('file-upload');
    const clearBtn = document.getElementById('clear-btn');
    const exportBtn = document.getElementById('export-btn');
    const fsBtn = document.getElementById('fs-btn');
    const labelsContainer = document.getElementById('labels-container');

    // Handle File Upload
    fileUpload.addEventListener('change', (event) => {
      const files = event.target.files;
      if (!files.length) return;

      Array.from(files).forEach((file) => {
        const url = URL.createObjectURL(file);
        
        gltfLoader.load(
          url, 
          (gltf) => {
            const model = gltf.scene;

            // Calculate bounding box to normalize size
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = maxDim > 0 ? (4 / maxDim) : 1; // Scale to fit within a 4 unit box

            // Create wrapper to easily center and scale
            const wrapper = new THREE.Group();
            model.position.set(-center.x, -center.y, -center.z); // Center model to origin
            wrapper.add(model);
            
            wrapper.scale.setScalar(scale);
            
            // Space models out along the X axis
            wrapper.position.x = modelIndex * spacing;
            
            scene.add(wrapper);
            models.push(wrapper);

            // Create HTML Label
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = file.name;
            labelsContainer.appendChild(label);
            
            labels.push({
              element: label,
              position: new THREE.Vector3(modelIndex * spacing, (size.y / 2) * scale + 0.3, 0)
            });

            // Adjust camera to look at the center of all models
            const totalWidth = modelIndex * spacing;
            controls.target.set(totalWidth / 2, 0, 0);
            
            // Adjust camera position to fit new models roughly
            camera.position.z = Math.max(8, totalWidth * 0.8);
            camera.position.x = totalWidth / 2;

            modelIndex++;
            URL.revokeObjectURL(url); // clean up
          },
          undefined,
          (error) => {
            console.error('An error happened while loading ' + file.name, error);
            alert('Error loading ' + file.name);
          }
        );
      });
      
      // Clear input so we can upload the same files again if needed
      event.target.value = '';
    });

    // Handle Clear
    clearBtn.addEventListener('click', () => {
      models.forEach(m => scene.remove(m));
      models = [];
      
      labels.forEach(l => l.element.remove());
      labels = [];
      
      modelIndex = 0;
      controls.target.set(0, 0, 0);
      camera.position.set(0, 2, 8);
    });

    // Handle PNG Export
    exportBtn.addEventListener('click', () => {
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'multiviewer-export.png';
      a.click();
    });

    // Handle fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.body.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fsBtn.textContent = '[ Exit ]';
      } else {
        fsBtn.textContent = '[ Fullscreen ]';
      }
    });

    // Handle Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Update labels positions
      labels.forEach(l => {
        const tempV = l.position.clone();
        tempV.project(camera);

        // Check if label is behind the camera
        if (tempV.z > 1) {
          l.element.style.display = 'none';
        } else {
          l.element.style.display = 'block';
          const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
          const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
          l.element.style.left = `${x}px`;
          l.element.style.top = `${y}px`;
        }
      });

      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
