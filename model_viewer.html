<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D GLB & GLTF Model Viewer — Draco & Multi-Model Support</title>
  <link rel="stylesheet" href="/src/model_viewer.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app-container">
    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Hidden File Input -->
    <input type="file" id="file-upload-input" multiple accept=".glb,.gltf,.bin" style="display: none;">

    <!-- Top Floating Toolbar -->
    <div id="top-toolbar" class="glass-panel">
      <div class="toolbar-title">
        <span>🌲 Tree Model Viewer</span>
        <span class="badge badge-draco">Draco Enabled</span>
      </div>

      <button id="btn-upload-file" class="btn btn-primary" title="Upload GLB or GLTF File">
        📁 Open Model
      </button>
      
      <button id="btn-load-all-presets" class="btn" title="Load Grid of Tree Presets">
        ✨ Load All Presets
      </button>

      <div class="toolbar-divider"></div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Layout:</span>
        <select id="layout-mode-select" class="select-input" style="width: auto;">
          <option value="grid">Grid Array</option>
          <option value="stacked">Stacked Origin</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <button id="btn-reset-cam" class="btn" title="Fit Camera to Scene">
        🎯 Fit View
      </button>

      <button id="btn-screenshot" class="btn" title="Export PNG Screenshot">
        📷 Screenshot
      </button>
    </div>

    <!-- Left Sidebar: Catalog & Model List -->
    <div id="left-sidebar">
      <!-- Active Loaded Models -->
      <div class="glass-panel" style="display: flex; flex-direction: column; height: 45%;">
        <div class="panel-header">
          <div class="panel-title">
            <span>📦 Loaded Models</span>
            <span id="loaded-count-badge" class="badge">0</span>
          </div>
          <button id="btn-clear-all" class="btn btn-danger btn-icon" title="Clear All Models">🗑️</button>
        </div>
        <div id="active-models-list" class="panel-content">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Tree Presets Catalog -->
      <div class="glass-panel" style="display: flex; flex-direction: column; flex: 1;">
        <div class="panel-header">
          <div class="panel-title">🌳 Tree Catalog (assets/Trees)</div>
        </div>
        <div id="preset-catalog" class="panel-content">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Inspector & Lighting -->
    <div id="right-sidebar">
      <!-- Selected Model Inspector -->
      <div class="glass-panel" style="display: flex; flex-direction: column;">
        <div class="panel-header">
          <div class="panel-title">⚙️ Model Inspector</div>
        </div>
        <div id="selected-model-inspector" class="panel-content">
          <!-- Populated dynamically when a model is selected -->
        </div>
      </div>

      <!-- Lighting & Environment Panel -->
      <div class="glass-panel" style="display: flex; flex-direction: column;">
        <div class="panel-header">
          <div class="panel-title">☀️ Lighting & World</div>
        </div>
        <div class="panel-content">
          <div class="control-group">
            <label class="control-label">Sun Light Intensity</label>
            <input type="range" class="slider-input" id="env-light-intensity" min="0.2" max="3.0" step="0.1" value="1.0">
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Stats Overlay -->
    <div id="stats-overlay" class="glass-panel">
      <div class="stat-item"><span>⚡ FPS:</span> <span id="stat-fps" class="stat-value">60</span></div>
      <div class="stat-item"><span>🔺 Triangles:</span> <span id="stat-polys" class="stat-value">0</span></div>
      <div class="stat-item"><span>📍 Vertices:</span> <span id="stat-verts" class="stat-value">0</span></div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Drag & Drop Fullscreen Overlay -->
    <div id="dropzone-overlay">
      <div style="font-size: 54px;">📥</div>
      <div class="dropzone-title">Drop 3D Models Here</div>
      <div class="dropzone-subtitle">Supports .GLB and .GLTF formats (with Draco compression)</div>
    </div>
  </div>

  <script type="module" src="/src/model_viewer.js"></script>
</body>
</html>
